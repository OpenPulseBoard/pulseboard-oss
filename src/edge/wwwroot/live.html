<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>PulseBoard</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242d;
      --fg: #e6e6e6;
      --muted: #8a93a1;
      --accent: #5ec8ff;
      --ok: #5cd97a;
      --warn: #f0c452;
      --err: #f25f5c;
      --grid: #232833;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg); color: var(--fg);
    }
    header {
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #000;
      display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 14px; margin: 0; letter-spacing: 1px; color: var(--accent); }
    header .status { color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
    section { background: var(--panel); border: 1px solid #000; border-radius: 6px; }
    section h2 { margin: 0; padding: 8px 12px; font-size: 12px; color: var(--muted);
                 border-bottom: 1px solid var(--grid); text-transform: uppercase; letter-spacing: 1px; }
    #metrics { grid-column: 1 / span 2; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px; padding: 10px; }
    .card { background: var(--panel-2); border-radius: 4px; padding: 8px 10px; }
    .card .name { color: var(--accent); font-weight: bold; font-size: 12px; }
    .card .value { font-size: 22px; margin-top: 2px; }
    .card canvas { display: block; width: 100%; height: 40px; margin-top: 4px; }
    #logs ul { list-style: none; margin: 0; padding: 6px 10px; max-height: 50vh; overflow: auto; }
    #logs li { padding: 3px 4px; border-bottom: 1px dashed var(--grid); white-space: pre-wrap; }
    #logs .level-error { color: var(--err); }
    #logs .level-warn  { color: var(--warn); }
    #logs .level-info  { color: var(--fg); }
    #logs .ts { color: var(--muted); margin-right: 8px; }
    #logs .svc { color: var(--accent); margin-right: 8px; }
    #alerts ul { list-style: none; margin: 0; padding: 6px 10px; max-height: 20vh; overflow: auto; }
    #alerts li { padding: 4px 6px; border-left: 3px solid var(--err); margin: 4px 0;
                 background: rgba(242, 95, 92, 0.08); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: var(--muted); margin-right: 6px; vertical-align: middle; }
    .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  </style>
</head>
<body>
<header>
  <h1><img src="/pulse-board-logo-dark.svg" alt="PulseBoard" style="height:38px;display:block;" /></h1>
  <span class="status"><span id="dot" class="dot"></span><span id="conn">connecting…</span></span>
  <span class="status" id="counts"></span>
  <span class="status" id="workspace-badge" title="Active workspace"
        style="margin-left:auto; display:inline-flex; align-items:center; gap:6px;">
    <span style="background:#1f242d; color:#5ec8ff; font-size:11px;
                 padding:2px 7px; border-radius:3px;">workspace</span>
    <span id="workspace-slug">—</span>
  </span>
  <span class="status" style="margin-left:12px;"><a href="/admin" style="color:var(--accent);text-decoration:none;">admin →</a></span>
</header>
<main>
  <section id="metrics">
    <h2>Metrics</h2>
    <div class="grid" id="metric-grid"></div>
  </section>
  <section id="alerts">
    <h2>Alerts</h2>
    <ul id="alert-list"><li style="border:none;background:none;color:var(--muted);">No alerts.</li></ul>
  </section>
  <section id="logs">
    <h2>Logs</h2>
    <ul id="log-list"></ul>
  </section>
</main>

<script>
const MAX_POINTS = 120;
const MAX_LOGS   = 300;

const state = {
  metrics: new Map(), // name -> { points: [{ts,value}], el, canvas }
  logs: [],
  alerts: []
};

const $ = (id) => document.getElementById(id);

// Workspace tenant badge — see /src/edge/wwwroot/index.html for the
// canonical copy of this logic.
(async function setWorkspaceBadge() {
  const el    = document.getElementById("workspace-slug");
  const badge = document.getElementById("workspace-badge");
  if (!el) return;
  const render = (slug, host, confirmed) => {
    el.textContent = slug;
    if (badge) badge.title =
      (confirmed ? "Tenant: " : "Tenant (unconfirmed): ") + slug +
      (host ? " · host: " + host : "");
  };
  try {
    const tok = sessionStorage.getItem("pb.bearer");
    const headers = tok ? { "Authorization": "Bearer " + tok } : {};
    const r = await fetch("/auth/me", { headers, credentials: "same-origin" });
    if (r.ok) {
      const me = await r.json();
      if (me && me.slug) { render(me.slug, location.hostname, true); return; }
    }
  } catch { /* fall through */ }
  const host  = location.hostname || "";
  const parts = host.split(".");
  const slug  = (parts.length >= 3 && parts[0] !== "www") ? parts[0]
              : (host === "localhost" || /^\d+\.\d+\.\d+\.\d+$/.test(host)) ? "local"
              : host;
  render(slug + " ?", host, false);
})();
const fmt = (n) => Number.isFinite(n) ? (Math.abs(n) >= 100 ? n.toFixed(0) : n.toFixed(3)) : String(n);
const fmtTs = (ms) => new Date(ms).toISOString().substr(11, 8);

function ensureMetric(name) {
  let m = state.metrics.get(name);
  if (m) return m;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="name"></div><div class="value">—</div><canvas></canvas>`;
  card.querySelector('.name').textContent = name;
  $('metric-grid').appendChild(card);
  m = { points: [], el: card, valueEl: card.querySelector('.value'),
        canvas: card.querySelector('canvas') };
  state.metrics.set(name, m);
  return m;
}

function pushMetric(name, ts, value) {
  const m = ensureMetric(name);
  m.points.push({ ts, value });
  if (m.points.length > MAX_POINTS) m.points.splice(0, m.points.length - MAX_POINTS);
  m.valueEl.textContent = fmt(value);
  drawSparkline(m);
}

function drawSparkline(m) {
  const c = m.canvas;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const pts = m.points;
  if (pts.length < 2) return;
  let lo = +Infinity, hi = -Infinity;
  for (const p of pts) { if (p.value < lo) lo = p.value; if (p.value > hi) hi = p.value; }
  if (lo === hi) { lo -= 1; hi += 1; }
  ctx.strokeStyle = '#5ec8ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = (i / (pts.length - 1)) * w;
    const y = h - ((p.value - lo) / (hi - lo)) * (h - 2) - 1;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function pushLog(entry) {
  state.logs.push(entry);
  if (state.logs.length > MAX_LOGS) state.logs.shift();
  const ul = $('log-list');
  const li = document.createElement('li');
  li.className = 'level-' + (entry.level || 'info').toLowerCase();
  li.innerHTML = `<span class="ts">${fmtTs(entry.ts)}</span>` +
                 `<span class="svc">${entry.service || '-'}</span>` +
                 `<span>${escapeHtml(entry.message || '')}</span>`;
  ul.appendChild(li);
  while (ul.childNodes.length > MAX_LOGS) ul.removeChild(ul.firstChild);
  ul.scrollTop = ul.scrollHeight;
}

function pushAlert(a) {
  state.alerts.unshift(a);
  const ul = $('alert-list');
  ul.innerHTML = '';
  if (state.alerts.length === 0) {
    ul.innerHTML = '<li style="border:none;background:none;color:var(--muted);">No alerts.</li>';
    return;
  }
  for (const x of state.alerts.slice(0, 20)) {
    const li = document.createElement('li');
    li.textContent = `[${fmtTs(x.firedAt)}] ${x.rule} — ${x.metric} = ${fmt(x.value)}`;
    ul.appendChild(li);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function bootstrap() {
  try {
    const names = await (await fetch('/api/metrics')).json();
    for (const n of names) {
      const series = await (await fetch('/api/metrics/' + encodeURIComponent(n))).json();
      for (const [ts, v] of series) pushMetric(n, ts, v);
    }
    const logs = await (await fetch('/api/logs?tail=100')).json();
    for (const e of logs) pushLog(e);
  } catch (e) { console.warn('bootstrap failed', e); }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $('dot').classList.add('live'); $('conn').textContent = 'live'; };
  ws.onclose = () => {
    $('dot').classList.remove('live'); $('conn').textContent = 'reconnecting…';
    setTimeout(connect, 1500);
  };
  ws.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'metric') pushMetric(msg.name, msg.ts, msg.value);
    else if (msg.type === 'log') pushLog(msg);
    else if (msg.type === 'alert') pushAlert(msg);
    $('counts').textContent =
      `${state.metrics.size} metrics · ${state.logs.length} log lines · ${state.alerts.length} alerts`;
  };
}

bootstrap().then(connect);
</script>
</body>
</html>
