<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>PulseBoard</title>
  <link rel="stylesheet" href="/shell.css" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242d;
      --fg: #e6e6e6;
      --muted: #8a93a1;
      --accent: #5ec8ff;
      --ok: #5cd97a;
      --warn: #f0c452;
      --err: #f25f5c;
      --grid: #232833;
    }
    [data-theme="light"] {
      --bg:#f0f2f5; --panel:#ffffff; --panel-2:#e8edf3;
      --fg:#1a1f2b; --muted:#6b7280; --accent:#0077cc;
      --ok:#16a34a; --warn:#ca8a04; --err:#dc2626; --grid:#d1d9e6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg); color: var(--fg);
    }
    header .status { color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
    main > section { min-width: 0; }
    section { background: var(--panel); border: 1px solid #000; border-radius: 6px; }
    section h2 { margin: 0; padding: 8px 12px; font-size: 12px; color: var(--muted);
                 border-bottom: 1px solid var(--grid); text-transform: uppercase; letter-spacing: 1px; }
    #metrics { grid-column: 1 / span 2; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px; padding: 10px; }
    @media (max-width: 1400px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 960px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card { background: var(--panel-2); border-radius: 4px; padding: 8px 10px; }
    .card .name { margin-bottom: 4px; }
    .card .name .base {
      color: var(--accent); font-weight: bold; font-size: 12px;
      overflow-wrap: anywhere;
    }
    .card .name .parts {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
      color: var(--muted); font-size: 11px;
    }
    .card .name .part {
      display: inline-block; max-width: 100%;
      padding: 1px 6px; border-radius: 10px;
      background: rgba(94, 200, 255, 0.12);
      border: 1px solid rgba(94, 200, 255, 0.24);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card .value { font-size: 22px; margin-top: 2px; }
    .card canvas { display: block; width: 100%; height: 120px; margin-top: 4px; }
    #logs ul { list-style: none; margin: 0; padding: 6px 10px; max-height: 50vh; overflow: auto; }
    #logs li { padding: 3px 4px; border-bottom: 1px dashed var(--grid); white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    #logs .level-error { color: var(--err); }
    #logs .level-warn  { color: var(--warn); }
    #logs .level-info  { color: var(--fg); }
    #logs .ts { color: var(--muted); margin-right: 8px; }
    #logs .svc { color: var(--accent); margin-right: 8px; }
    #alerts ul { list-style: none; margin: 0; padding: 6px 10px; max-height: 20vh; overflow: auto; }
    #alerts li { padding: 4px 6px; border-left: 3px solid var(--err); margin: 4px 0;
                 background: rgba(242, 95, 92, 0.08); overflow-wrap: anywhere; word-break: break-word; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: var(--muted); margin-right: 6px; vertical-align: middle; }
    .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

    header.topbar {
      border-bottom: 0;
      padding: 12px;
      gap: 10px;
    }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div id="sidebar-backdrop" aria-hidden="true"></div>

<header class="topbar">
  <div class="shell-topbar-row">
    <h1><img id="brand-logo" class="shell-brand-logo" src="/pulse-board-logo-dark.svg" alt="PulseBoard" /></h1>
    <button id="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-controls="main-nav" aria-expanded="true">☰</button>
  </div>
  <nav id="main-nav"></nav>
  <span class="status"><span id="dot" class="dot"></span><span id="conn">connecting…</span></span>
  <span class="status" id="counts"></span>
  <span class="status shell-workspace-badge" id="workspace-badge" title="Active workspace">
    <span class="shell-workspace-pill">workspace</span>
    <span id="workspace-slug" class="shell-workspace-slug">—</span>
  </span>
  <button id="theme-toggle" class="shell-theme-btn" title="Toggle light/dark mode">🌙</button>
</header>
<main>
  <section id="metrics">
    <h2>Metrics</h2>
    <div class="grid" id="metric-grid"></div>
  </section>
  <section id="alerts">
    <h2>Alerts</h2>
    <ul id="alert-list"><li style="border:none;background:none;color:var(--muted);">No alerts.</li></ul>
  </section>
  <section id="logs">
    <h2>Logs</h2>
    <ul id="log-list"></ul>
  </section>
</main>

<script src="/shell.js"></script>
<script>
const MAX_POINTS = 120;
const MAX_LOGS   = 300;
const DEFAULT_LOOKBACK_MS = 60 * 60 * 1000;
const SERIES_COLORS = [
  '#5ec8ff', '#5cd97a', '#f0c452', '#f25f5c', '#7ee0d4', '#c39bff', '#ff9f68', '#89a8ff'
];

const state = {
  metrics: new Map(), // name -> { points: [{ts,value}], el, canvas }
  logs: [],
  alerts: []
};

const $ = (id) => document.getElementById(id);
const fmt = (n) => Number.isFinite(n) ? (Math.abs(n) >= 100 ? n.toFixed(0) : n.toFixed(3)) : String(n);
const fmtTs = (ms) => new Date(ms).toISOString().substr(11, 8);

function pbBearer() { return sessionStorage.getItem('pb.bearer'); }
function pbAuthHeaders(extra) {
  const h = Object.assign({}, extra || {});
  const tok = pbBearer();
  if (tok) h.Authorization = 'Bearer ' + tok;
  return h;
}
function pbRedirectSignin() {
  sessionStorage.removeItem('pb.bearer');
  const back = location.pathname + location.search + location.hash;
  location.href = '/signin?returnTo=' + encodeURIComponent(back);
}
async function authFetch(url, opts) {
  const req = Object.assign({ credentials: 'same-origin' }, opts || {});
  req.headers = pbAuthHeaders(req.headers);
  const r = await fetch(url, req);
  if (r.status === 401 || r.status === 403) {
    pbRedirectSignin();
    throw new Error('unauthorized');
  }
  return r;
}
async function authFetchJson(url, opts) {
  const r = await authFetch(url, opts);
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  return r.json();
}

function parseMetricName(name) {
  const raw = String(name || '').trim();
  if (!raw) return { base: 'unknown', parts: [] };

  const qIdx = raw.indexOf('?');
  if (qIdx >= 0) {
    const base = raw.slice(0, qIdx) || raw;
    const params = new URLSearchParams(raw.slice(qIdx + 1));
    const parts = [];
    for (const [k, v] of params.entries()) parts.push(`${k}: ${v}`);
    return { base, parts };
  }

  const m = raw.match(/^(.*?)\{(.*)\}$/);
  if (m) {
    const base = m[1].trim() || raw;
    const body = m[2].trim();
    const parts = [];
    const re = /([^=,\s]+)\s*=\s*"([^"]*)"/g;
    let hit;
    while ((hit = re.exec(body)) !== null) parts.push(`${hit[1]}: ${hit[2]}`);
    if (parts.length === 0 && body) {
      for (const p of body.split(',')) {
        const t = p.trim();
        if (t) parts.push(t.replace(/\s*=\s*/g, ': '));
      }
    }
    return { base, parts };
  }

  return { base: raw, parts: [] };
}

function ensureMetric(name) {
  let m = state.metrics.get(name);
  if (m) return m;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="name"><div class="base"></div><div class="parts"></div></div><div class="value">—</div><canvas></canvas>`;
  const parsed = parseMetricName(name);
  card.querySelector('.base').textContent = parsed.base;
  const partsEl = card.querySelector('.parts');
  for (const part of parsed.parts) {
    const chip = document.createElement('span');
    chip.className = 'part';
    chip.textContent = part;
    chip.title = part;
    partsEl.appendChild(chip);
  }
  $('metric-grid').appendChild(card);
  m = { points: [], el: card, valueEl: card.querySelector('.value'),
        canvas: card.querySelector('canvas'), color: SERIES_COLORS[state.metrics.size % SERIES_COLORS.length] };
  state.metrics.set(name, m);
  return m;
}

function pushMetric(name, ts, value) {
  const m = ensureMetric(name);
  m.points.push({ ts, value });
  if (m.points.length > MAX_POINTS) m.points.splice(0, m.points.length - MAX_POINTS);
  m.valueEl.textContent = fmt(value);
  drawSparkline(m);
}

function drawSparkline(m) {
  const c = m.canvas;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const ml = 42, mr = 8, mt = 10, mb = 24;
  const pw = Math.max(1, w - ml - mr);
  const ph = Math.max(1, h - mt - mb);

  ctx.strokeStyle = '#2a3140';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ml, mt);
  ctx.lineTo(ml, h - mb);
  ctx.lineTo(w - mr, h - mb);
  ctx.stroke();

  const pts = m.points;
  if (pts.length < 2) {
    ctx.fillStyle = '#8a93a1';
    ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('value', 4, mt + ph / 2);
    ctx.fillText('time', w - 30, h - 6);
    return;
  }

  let lo = +Infinity, hi = -Infinity;
  for (const p of pts) { if (p.value < lo) lo = p.value; if (p.value > hi) hi = p.value; }
  if (lo === hi) { lo -= 1; hi += 1; }

  ctx.fillStyle = '#8a93a1';
  ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'right';
  ctx.fillText(fmt(hi), ml - 4, mt + 8);
  ctx.fillText(fmt(lo), ml - 4, h - mb);
  ctx.textAlign = 'left';
  ctx.fillText(new Date(pts[0].ts).toISOString().substr(11, 5), ml + 2, h - 6);
  ctx.textAlign = 'right';
  ctx.fillText(new Date(pts[pts.length - 1].ts).toISOString().substr(11, 5), w - mr, h - 6);
  ctx.textAlign = 'left';
  ctx.fillText('value', 4, mt + ph / 2);
  ctx.textAlign = 'center';
  ctx.fillText('time', ml + (pw / 2), h - 14);

  ctx.strokeStyle = m.color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = ml + (i / (pts.length - 1)) * pw;
    const y = mt + (1 - ((p.value - lo) / (hi - lo))) * ph;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function pushLog(entry) {
  state.logs.push(entry);
  if (state.logs.length > MAX_LOGS) state.logs.shift();
  const ul = $('log-list');
  const li = document.createElement('li');
  li.className = 'level-' + (entry.level || 'info').toLowerCase();
  li.innerHTML = `<span class="ts">${fmtTs(entry.ts)}</span>` +
                 `<span class="svc">${entry.service || '-'}</span>` +
                 `<span>${escapeHtml(entry.message || '')}</span>`;
  ul.appendChild(li);
  while (ul.childNodes.length > MAX_LOGS) ul.removeChild(ul.firstChild);
  ul.scrollTop = ul.scrollHeight;
}

function pushAlert(a) {
  state.alerts.unshift(a);
  const ul = $('alert-list');
  ul.innerHTML = '';
  if (state.alerts.length === 0) {
    ul.innerHTML = '<li style="border:none;background:none;color:var(--muted);">No alerts.</li>';
    return;
  }
  for (const x of state.alerts.slice(0, 20)) {
    const li = document.createElement('li');
    li.textContent = `[${fmtTs(x.firedAt)}] ${x.rule} — ${x.metric} = ${fmt(x.value)}`;
    ul.appendChild(li);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function bootstrap() {
  try {
    const names = await authFetchJson('/api/metrics');
    const sinceMs = Date.now() - DEFAULT_LOOKBACK_MS;
    for (const n of names) {
      const series = await authFetchJson('/api/metrics/' + encodeURIComponent(n) + '?sinceMs=' + sinceMs + '&step=raw');
      for (const [ts, v] of series) pushMetric(n, ts, v);
    }
    const logs = await authFetchJson('/api/logs?tail=100');
    for (const e of logs) pushLog(e);
  } catch (e) { console.warn('bootstrap failed', e); }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $('dot').classList.add('live'); $('conn').textContent = 'live'; };
  ws.onclose = () => {
    $('dot').classList.remove('live'); $('conn').textContent = 'reconnecting…';
    setTimeout(connect, 1500);
  };
  ws.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'metric') pushMetric(msg.name, msg.ts, msg.value);
    else if (msg.type === 'log') pushLog(msg);
    else if (msg.type === 'alert') pushAlert(msg);
    $('counts').textContent =
      `${state.metrics.size} metrics · ${state.logs.length} log lines · ${state.alerts.length} alerts`;
  };
}

bootstrap().then(connect);
</script>
</body>
</html>
