<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>PulseBoard — Sign in</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="/_auth.css" />
</head>
<body>

<header class="nav">
  <a href="/" class="brand"><img src="/pulse-board-logo-dark.svg" alt="PulseBoard" style="height:78px;display:block;" /></a>
  <nav>
    <a href="/docs">Docs</a>
    <a href="/pricing">Pricing</a>
  </nav>
  <span class="grow"></span>
  <a href="/signup">Create account →</a>
</header>

<div class="wrap">

<div class="card">
  <h1>Sign in</h1>
  <p class="lede">Access your member portal to manage workspaces and billing.</p>

  <div class="banner ok" id="verifiedBanner" style="display:none;">
    Email verified. You can sign in now.
  </div>
  <div class="banner ok" id="resetBanner" style="display:none;">
    Password updated. Please sign in with your new password.
  </div>
  <div class="banner err" id="err" style="display:none;"></div>

  <form id="f" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required
           autocomplete="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required
           autocomplete="current-password" placeholder="••••••••••••" />

    <button type="submit" class="primary" id="submitBtn">Sign in →</button>
  </form>

  <div class="divider">or</div>

  <a href="/api/auth/github/start">
    <button type="button" class="secondary">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.81.06 1.23.83 1.23.83.72 1.22 1.88.87 2.34.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.96 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.13 0 0 .67-.21 2.2.82a7.7 7.7 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.11.16 1.93.08 2.13.51.56.82 1.28.82 2.15 0 3.08-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      Continue with GitHub
    </button>
  </a>

  <div class="alt">
    <a href="/forgot">Forgot your password?</a>
    &nbsp;·&nbsp;
    <a href="/signup">Create account</a>
  </div>
</div>

</div>

<script>
(function () {
  const qp = new URLSearchParams(location.search);
  if (qp.get('verified') === '1') document.getElementById('verifiedBanner').style.display = 'block';
  if (qp.get('reset') === '1')    document.getElementById('resetBanner').style.display = 'block';
  const e = qp.get('email'); if (e) document.getElementById('email').value = e;
})();

const form = document.getElementById('f');
const errEl = document.getElementById('err');
const btn   = document.getElementById('submitBtn');

function showErr(msg) {
  errEl.textContent = msg;
  errEl.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.style.display = 'none';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/auth/signin', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      // The portal SPA lives at /portal (Phase 10 step 6). Until that
      // ships we still want a successful sign-in to feel real, so go
      // to /portal and let the server serve a stub.
      location.href = '/portal';
      return;
    }
    if (r.status === 403 && (j.error || '').toLowerCase().includes('verify')) {
      showErr('Please verify your email first. Check your inbox for a link from PulseBoard.');
      return;
    }
    showErr(j.error || ('sign-in failed: HTTP ' + r.status));
  } catch (e) {
    showErr(e.message || String(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in →';
  }
});
</script>

</body>
</html>
