<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PulseBoard — Sign in</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1f242d; --border: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #5ec8ff;
    --ok: #5cd97a; --err: #f25f5c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
                font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.nav {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
  }
  header.nav .brand { font: 600 15px/1 ui-monospace, monospace;
                       color: var(--accent); letter-spacing: 2px; }
  header.nav nav { display: flex; gap: 4px; }
  header.nav nav a { color: var(--muted); padding: 6px 12px; border-radius: 4px; }
  header.nav nav a:hover { color: var(--fg); background: var(--panel-2); text-decoration: none; }
  header.nav .grow { flex: 1; }
  .wrap { max-width: 460px; margin: 80px auto; padding: 0 24px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; padding: 1.6rem 1.8rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .lede { color: var(--muted); margin: 0 0 1.5rem; }
  label { display: block; margin: .8rem 0 .25rem; font-size: 13px; color: var(--muted); }
  input[type=password], input[type=text] {
    width: 100%; padding: .55rem .7rem; background: #0a0d12;
    color: var(--fg); border: 1px solid var(--border); border-radius: 4px;
    font: 13px/1.4 ui-monospace, monospace;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 1.2rem; padding: .65rem 1.1rem; width: 100%;
    background: var(--accent); color: #04121d; border: 0;
    border-radius: 4px; font: 600 14px/1 inherit; cursor: pointer;
  }
  button:hover { background: #8ad8ff; }
  .alt { margin-top: 1rem; text-align: center; color: var(--muted); font-size: 13px; }
  .err { color: var(--err); margin-top: 1rem; }
  .divider { text-align: center; color: var(--muted); margin: 1.4rem 0 .8rem;
             font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row a {
    text-align: center; padding: .55rem .7rem; border-radius: 4px;
    border: 1px solid var(--border); color: var(--fg);
  }
  .row a:hover { background: var(--panel-2); text-decoration: none; }
</style>
</head>
<body>

<header class="nav">
  <a href="/" class="brand">PULSEBOARD</a>
  <nav>
    <a href="/docs">Docs</a>
    <a href="/pricing">Pricing</a>
  </nav>
  <span class="grow"></span>
  <a href="/signup">No account?</a>
</header>

<div class="wrap">
<div class="card" id="apexCard" style="display:none;">
  <h1>Find your workspace</h1>
  <p class="lede">Each PulseBoard tenant has its own subdomain. Enter your
    workspace slug to continue.</p>

  <form id="findForm">
    <label for="slug">Workspace slug</label>
    <input id="slug" name="slug" type="text" required minlength="2" maxlength="40"
           pattern="[a-z0-9][a-z0-9-]*" placeholder="acme"
           autocomplete="off" autocapitalize="off" spellcheck="false" />
    <button type="submit">Go to workspace →</button>
  </form>
  <div class="err" id="apexErr" style="display:none;"></div>

  <div class="alt">
    No workspace yet? <a href="/signup">Sign up →</a>
  </div>
</div>

<div class="card" id="tenantCard" style="display:none;">
  <h1>Sign in</h1>
  <p class="lede">Paste your API key. We store it in this browser tab only.</p>

  <form id="f">
    <label for="key">API key</label>
    <input id="key" name="key" type="password" required minlength="10"
           placeholder="pk_..." autocomplete="off" />

    <button type="submit">Continue →</button>
  </form>
  <div class="err" id="err" style="display:none;"></div>

  <div class="alt">
    Don’t have a key? <a href="/signup">Sign up →</a>
  </div>
</div>
</div>

<script>
// Two modes: apex marketing host ("pulseboard.cloud", "www.pulseboard.cloud",
// localhost during dev) shows a "find your workspace" form; a tenant
// subdomain ("acme.pulseboard.cloud") shows the paste-API-key form.
const host    = location.hostname;
const parts   = host.split('.');
// Apex = exactly two labels (root domain), or "www.<root>", or any single-label host
// like "localhost"/"127.0.0.1". A tenant subdomain has 3+ labels and the first
// label is not "www".
const isApex  = parts.length < 3 || parts[0] === 'www';

if (isApex) {
  document.getElementById('apexCard').style.display = 'block';
  const findForm = document.getElementById('findForm');
  const apexErr  = document.getElementById('apexErr');
  findForm.addEventListener('submit', (e) => {
    e.preventDefault();
    apexErr.style.display = 'none';
    const slug = document.getElementById('slug').value.trim().toLowerCase();
    if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
      apexErr.textContent = 'Slug must be lowercase letters, digits, and dashes.';
      apexErr.style.display = 'block'; return;
    }
    // Strip "www." if present, then prepend the slug. "pulseboard.cloud" stays
    // as "pulseboard.cloud", "www.pulseboard.cloud" -> "pulseboard.cloud".
    const root = (parts[0] === 'www' ? parts.slice(1) : parts).join('.');
    location.href = location.protocol + '//' + slug + '.' + root + '/signin';
  });
} else {
  document.getElementById('tenantCard').style.display = 'block';
  const form  = document.getElementById('f');
  const errEl = document.getElementById('err');
  // Pre-fill the key if signup.html handed it off via the URL hash
  // (hashes never hit the server). Wipe the hash immediately so it
  // doesn't linger in the address bar.
  (function () {
    const h = location.hash || '';
    const m = h.match(/(?:^#|&)key=([^&]+)/);
    if (m) {
      try { document.getElementById('key').value = decodeURIComponent(m[1]); } catch {}
      history.replaceState(null, '', location.pathname + location.search);
    }
  })();
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';
    const key = document.getElementById('key').value.trim();
    if (!key.startsWith('pk_')) {
      errEl.textContent = 'API keys start with "pk_". Check that you pasted the full secret.';
      errEl.style.display = 'block'; return;
    }
    // Respect ?returnTo= so callers can bounce users back to the page
    // that demanded auth (e.g. the dashboard SPA).
    const qp = new URLSearchParams(location.search);
    const rawReturn = qp.get('returnTo') || '/admin';
    // Only allow same-origin relative paths to avoid open-redirect.
    const dest = (rawReturn.startsWith('/') && !rawReturn.startsWith('//'))
      ? rawReturn : '/admin';
    // Probe /auth/me — this validates the key without exposing tenant routes.
    try {
      const r = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + key } });
      if (!r.ok) throw new Error('Key rejected (HTTP ' + r.status + '). Double-check, or sign up for a new one.');
      sessionStorage.setItem('pb.bearer', key);
      location.href = dest;
    } catch (e) {
      // /auth/me may not exist in all builds; if so still accept the key — /admin will revalidate.
      if (String(e.message).includes('HTTP 404')) {
        sessionStorage.setItem('pb.bearer', key);
        location.href = dest;
        return;
      }
      errEl.textContent = e.message || String(e);
      errEl.style.display = 'block';
    }
  });
}
</script>

</body>
</html>
