<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>PulseBoard — Reset password</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="/_auth.css" />
</head>
<body>

<header class="nav">
  <a href="/" class="brand"><img src="/pulse-board-logo-dark.svg" alt="PulseBoard" style="height:78px;display:block;" /></a>
  <span class="grow"></span>
  <a href="/signin">Back to sign in</a>
</header>

<div class="wrap">

<div class="card" id="formCard">
  <h1>Choose a new password</h1>
  <p class="lede">Pick something you haven't used before.</p>

  <div class="banner err" id="err" style="display:none;"></div>

  <form id="f" novalidate>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" required
           minlength="12" maxlength="128"
           autocomplete="new-password"
           placeholder="at least 12 characters" />

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" required
           minlength="12" maxlength="128"
           autocomplete="new-password" />

    <button type="submit" class="primary" id="submitBtn">Update password →</button>
  </form>
</div>

<div class="card" id="missingCard" style="display:none;">
  <h1>Reset link is incomplete</h1>
  <p class="lede">This URL is missing its <code>token</code>. Open the link from your email again, or
    <a href="/forgot">request a new one</a>.</p>
</div>

</div>

<script>
const qp = new URLSearchParams(location.search);
const token = qp.get('token');
if (!token) {
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('missingCard').style.display = 'block';
}

const form = document.getElementById('f');
const errEl = document.getElementById('err');
const btn   = document.getElementById('submitBtn');

function showErr(msg) {
  errEl.textContent = msg;
  errEl.style.display = 'block';
}

form && form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.style.display = 'none';
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  if (password !== confirm) { showErr('Passwords do not match.'); return; }
  if (password.length < 12) { showErr('Password must be at least 12 characters.'); return; }
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    const r = await fetch('/api/auth/reset', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/signin?reset=1'; return; }
    if (r.status === 400 || r.status === 410) {
      showErr('This reset link has expired or already been used. Please request a new one.');
      return;
    }
    showErr(j.error || ('request failed: HTTP ' + r.status));
  } catch (e) {
    showErr(e.message || String(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Update password →';
  }
});
</script>

</body>
</html>
