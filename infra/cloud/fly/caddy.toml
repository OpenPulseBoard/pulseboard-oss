# fly.toml — public-facing Caddy front for pulseboard.cloud
#
# Runs the Caddyfile at ../Caddyfile. This is the ONLY app that holds
# a public IPv4/IPv6 for the apex + wildcard. Both pulseboard-site and
# pulseboard-provisioner are reached from here over flycast.
#
# Secrets to set (fly secrets set …):
#   PROVISIONER_URL=http://pulseboard-provisioner.flycast:8080
#   SITE_URL=http://pulseboard-site.flycast:8080
#
# DNS to set at the registrar (Route 53, Cloudflare, …):
#   pulseboard.cloud            A     <fly v4>
#   pulseboard.cloud            AAAA  <fly v6>
#   *.pulseboard.cloud          A     <fly v4>
#   *.pulseboard.cloud          AAAA  <fly v6>
# Fetch the IPs with `fly ips list -a pulseboard-caddy`.
#
# Deploy (run from repo root so the Dockerfile's build context can
# reach infra/cloud/Caddyfile):
#   fly apps create pulseboard-caddy
#   fly ips allocate-v4 -a pulseboard-caddy
#   fly ips allocate-v6 -a pulseboard-caddy
#   fly volumes create caddy_data --size 1 --region iad -a pulseboard-caddy
#   fly secrets set -a pulseboard-caddy \
#       PROVISIONER_URL=http://pulseboard-provisioner.flycast:8080 \
#       SITE_URL=http://pulseboard-site.flycast:8080
#   fly deploy -a pulseboard-caddy \
#       --config infra/cloud/fly/caddy.toml \
#       --dockerfile caddy.Dockerfile

app            = "pulseboard-caddy"
primary_region = "iad"

[build]
  # See ../../../caddy.Dockerfile at the repo root. We don't set
  # `dockerfile = …` here because flyctl resolves that path relative to
  # the deploy CWD; passing `--dockerfile caddy.Dockerfile` on the
  # command line keeps the contract explicit.

[mounts]
  source      = "caddy_data"
  destination = "/data"

[env]
  XDG_DATA_HOME = "/data"

[http_service]
  internal_port       = 80
  force_https         = false   # Caddy itself does TLS on :443
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 1

# Caddy listens on 80 (redirect/ACME) and 443 (TLS). Expose both
# directly — Fly's edge does NOT terminate TLS for us; on-demand certs
# require Caddy to own port 443.
[[services]]
  internal_port = 80
  protocol      = "tcp"
  [[services.ports]]
    port     = 80
    handlers = ["http"]

[[services]]
  internal_port = 443
  protocol      = "tcp"
  [[services.ports]]
    port     = 443
    handlers = []          # raw TCP — Caddy terminates TLS

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512
