name: image

# Build the OSS PulseBoard workspace image and push it to Fly's registry
# on every push to main. Tagged with both :latest (convenience) and
# :<sha> (pin per deploy).
#
# Required repo secret:
#   FLY_API_TOKEN  — token with registry push scope for the
#                    `pulseboard1` Fly registry repo.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "tests/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-builds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build workspace project
        run: dotnet build src/edge/PulseBoard.fsproj

  test:
    needs: validate-builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit and property tests
        run: >
          dotnet test tests/edge/PulseBoard.Tests.fsproj
          --configuration Release
          --filter "Category!=Postgres&Category!=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    needs: validate-builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Docker against registry.fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            registry.fly.io/pulseboard1:latest
            registry.fly.io/pulseboard1:${{ github.sha }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max
