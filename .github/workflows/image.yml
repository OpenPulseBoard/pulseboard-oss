name: image

# Build the PulseBoard workspace and cloud Docker images and push them
# to Fly's registry on every push to main. Each image is tagged with
# both :latest (convenience) and :<sha> (pin per deploy).
#
# Required repo secret:
#   FLY_API_TOKEN  — token with registry push scope for both the
#                    `pulseboard` and `pulseboard-cloud` Fly apps.
#                    Those apps must exist so their registry repos do.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "cloud.Dockerfile"
      - "src/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            dockerfile: Dockerfile
            tags: |
              registry.fly.io/pulseboard1:latest
              registry.fly.io/pulseboard1:${{ github.sha }}
          - name: cloud
            dockerfile: cloud.Dockerfile
            tags: |
              registry.fly.io/pulseboard-cloud:latest
              registry.fly.io/pulseboard-cloud:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Docker against registry.fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
