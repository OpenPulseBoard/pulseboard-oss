name: image

# Build the PulseBoard Docker image and push it to Fly's registry on
# every push to main. Tagged with both :latest (convenience) and
# :<sha> (pin per deploy). The four cloud Fly apps in
# infra/cloud/fly/ pull from registry.fly.io/pulseboard1.
#
# Required repo secret:
#   FLY_API_TOKEN  — `fly tokens create deploy -a pulseboard1` output;
#                    needs push scope on the `pulseboard` Fly app.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Docker against registry.fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.fly.io/pulseboard1:latest
            registry.fly.io/pulseboard1:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
