name: image

# Build the OSS PulseBoard workspace image and push it to GitHub
# Container Registry on every push to main. Tagged with both :latest
# (convenience) and :<sha> (pin per deploy).
#
# Auth uses the workflow's built-in GITHUB_TOKEN (no extra secrets
# required); the package will be created under the repository owner.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "tests/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-builds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build workspace project
        run: dotnet build src/edge/PulseBoard.fsproj

  test:
    needs: validate-builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git diff on PRs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit and property tests
        run: >
          dotnet test tests/edge/PulseBoard.Tests.fsproj
          --configuration Release
          --filter "Category!=Postgres&Category!=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory coverage/
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;TextSummary"
          cat coverage-report/Summary.txt

      - name: Enforce coverage gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF:   ${{ github.base_ref }}
        run: python3 tests/coverage-gate.py

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/

  build:
    needs: [validate-builds, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/pulseboard:latest
            ghcr.io/${{ env.OWNER_LC }}/pulseboard:${{ github.sha }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max
